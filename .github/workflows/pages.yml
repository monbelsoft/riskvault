# Publish the three pages to GitHub Pages.
#
# The site is configured to deploy through Actions (Settings -> Pages -> Source: GitHub Actions),
# and until this file existed there was nothing to do it: pushes landed on main and the published
# site stayed on whatever the old branch-based build had left there. There is nothing to build —
# every page is self-contained — so the whole job is to upload the repository and deploy it.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
