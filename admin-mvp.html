<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>RiskVault iGaming — CRM (MVP)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f7f4; --surface:#fdfffe; --text:#16241d; --accent:#0f9d63; --accent-soft:#e4f4ec;
  --accent-mid:#6dc79b; --n400:#3f5449; --n500:#55695d; --n600:#6d8177; --n700:#bdcfc5;
  --n800:#d6e3db; --n900:#e6efe9;
  --red:#d9534f; --red-soft:#fdecec; --amber:#c9852b; --amber-soft:#fdf3e6;
  --green:#3f9a6a; --green-soft:#e9f6ef; --blue:#3d7ec4; --blue-soft:#eaf2fb;
  --sh-sm:0 0 0 1px #e0ece5; --sh-md:0 0 0 1px #d6e3db,0 6px 18px rgba(22,36,29,.08);
  --sh-lg:0 0 0 1px #c8ddd1,0 18px 44px rgba(22,36,29,.18);
  --font:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:var(--font);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--n800);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes flash{from{background:#d9f0e2}}
/* live-data cues: a value that just changed, and a row that just arrived */
@keyframes uUp{0%{background:rgba(217,83,79,.24)}100%{background:transparent}}
@keyframes uDn{0%{background:rgba(15,157,99,.24)}100%{background:transparent}}
@keyframes uNe{0%{background:rgba(15,157,99,.16)}100%{background:transparent}}
.u-up{animation:uUp 1.1s ease-out}
.u-dn{animation:uDn 1.1s ease-out}
.u-ne{animation:uNe 1.1s ease-out}
@keyframes rowIn{0%{background:var(--accent-soft)}100%{background:transparent}}
tr.row-new > td{animation:rowIn .9s ease-out}
@keyframes streamIn{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
.vl.new-entry{animation:streamIn .45s ease-out}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.who b{white-space:nowrap}
td>a{white-space:nowrap}
td .nw{white-space:nowrap}
.app{display:grid;grid-template-columns:252px minmax(1200px,1fr);min-height:100vh}

/* ── rail ───────────────────────────────────────────────── */
aside{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0e4531,#072a1d);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.06);display:flex;flex-direction:column;padding:13px 11px;overflow:hidden}
.mark{display:flex;align-items:center;gap:10px;padding:0 2px 14px}
.mark .ic{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);flex:none}
.mark .ic svg{width:19px;height:19px;fill:none;stroke:#a9dcc4;stroke-width:1.4}
.mark b{display:block;font-weight:500;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#eafaf2}
.mark span{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#74a98f}
#rail{overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-right:-6px;padding-right:6px}
.grp{border-radius:9px}
.gh{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:0;background:transparent;color:#bfe0cf;text-align:left;border-radius:8px;font-size:13.5px}
.gh:hover{background:rgba(255,255,255,.08)}
.gh.on{background:rgba(255,255,255,.13);color:#fff;font-weight:500}
.gh svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.85}
.gh .l{flex:1}
.gh .cx{font-size:11px;opacity:.6}
.gh .bdg{font-size:11px;padding:1px 6px;border-radius:20px;background:rgba(255,255,255,.16);color:#eafaf2}
.gh .bdg.hot{background:#e87f7b;color:#2a1010;font-weight:600}
.sub{display:none;flex-direction:column;gap:1px;padding:2px 0 6px 12px;margin-left:11px;border-left:1px solid rgba(255,255,255,.13)}
.grp.open .sub{display:flex}
.sub button{display:flex;align-items:center;gap:7px;padding:5px 9px;border:0;border-radius:7px;background:transparent;
  color:#9ec8b3;text-align:left;font-size:13px;width:100%}
.sub button:hover{background:rgba(255,255,255,.08);color:#dff3e8}
.sub button.on{background:rgba(255,255,255,.15);color:#fff;font-weight:500}
.sub button .l{flex:1}
.sub button .bdg{font-size:10.5px;padding:0 5px;border-radius:20px;background:rgba(255,255,255,.16);color:#eafaf2}
.sub button .bdg.hot{background:#e87f7b;color:#2a1010;font-weight:600}
.railfoot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:9px}
.searchbtn{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:transparent;color:#a9dcc4;font-size:13.5px}
.searchbtn:hover{background:rgba(255,255,255,.12)}
.searchbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4}
.searchbtn .l{flex:1;text-align:left}
.searchbtn kbd{font-size:11px;border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:1px 5px;font-family:inherit}
.rolebtn{flex:1;border:1px solid rgba(255,255,255,.18);background:transparent;color:#a9dcc4;border-radius:7px;
  padding:5px 0;font-size:11.5px;font-weight:500}
.rolebtn:hover{background:rgba(255,255,255,.1)}
.rolebtn.on{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.34)}
.me{display:flex;align-items:center;gap:9px;padding:2px}
.me .av{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:12px;color:#eafaf2;flex:none}
.me b{display:block;font-size:13px;color:#eafaf2;font-weight:400}
.me span{display:block;font-size:11px;color:#74a98f}

/* ── context bar + topbar ───────────────────────────────── */
main{min-width:0;padding:0 0 56px}
.ctx{display:flex;align-items:center;gap:0;background:#0b3625;color:#bfe0cf;padding:0 22px;height:38px;font-size:12.5px;position:sticky;top:0;z-index:30}
.ctx .cf{display:flex;align-items:center;gap:6px;padding:0 13px;height:38px;border-right:1px solid rgba(255,255,255,.1);cursor:pointer;background:transparent;border-top:0;border-bottom:0;border-left:0;color:inherit}
.ctx .cf:first-child{border-left:1px solid rgba(255,255,255,.1)}
.ctx .cf:hover{background:rgba(255,255,255,.07);color:#fff}
.ctx .cf b{font-weight:500;color:#eafaf2}
.ctx .cf select{background:transparent;border:0;color:#eafaf2;font-weight:500;font-size:12.5px;padding:0;cursor:pointer;outline:none;max-width:170px}
.ctx .cf select option{background:#0b3625;color:#eafaf2}
.ctx label.cf{gap:7px}
.ctx .cf i{font-style:normal;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#6f9d86}
.ctx .env{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.ctx .env em{font-style:normal;width:7px;height:7px;border-radius:50%;background:#5fd08a;display:block;animation:pulseDot 2.4s infinite}
.top{display:flex;align-items:flex-end;gap:14px;padding:15px 22px 0}
.top .kick{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--n600)}
.top h1{margin:2px 0 0;font-size:23px;font-weight:600;letter-spacing:-.01em}
.top .sub2{font-size:12.5px;color:var(--n600);margin-top:3px;max-width:640px}
.livepill{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--n500);padding-bottom:3px}
.livepill i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulseDot 2s infinite}
.livepill b{color:var(--text);font-weight:600}
.clock{font-size:19px;font-weight:600;padding-bottom:1px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:9px;padding-bottom:2px}
.fld{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:9px;box-shadow:var(--sh-sm);padding:7px 11px;font-size:13px;color:var(--n500)}
.fld svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;flex:none}
.fld input{border:0;background:transparent;outline:none;width:190px}
.fld kbd{font-size:10.5px;border:1px solid var(--n800);border-radius:5px;padding:1px 5px;font-family:inherit}
.btn{border-radius:9px;padding:7px 13px;font-size:13px;border:1px solid var(--n800);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:#eaf6ef;border-color:var(--accent-mid)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:#0c8654;border-color:#0c8654}
.btn-o{color:var(--accent);border-color:var(--accent-mid)}
.btn-d{color:var(--red);border-color:#eec4c2}
.btn-d:hover{background:var(--red-soft);border-color:var(--red)}
.btn-s{padding:4px 9px;font-size:12px;border-radius:7px}
.btn-x{width:30px;height:30px;border-radius:8px;border:1px solid var(--n800);background:var(--surface);
  display:grid;place-items:center;padding:0;flex:none}
.btn-x svg{width:15px;height:15px;fill:none;stroke:var(--n500);stroke-width:1.8;stroke-linecap:round}
.btn-x:hover{background:var(--red-soft);border-color:var(--red)}
.btn-x:hover svg{stroke:var(--red)}
.tabs{display:flex;gap:20px;padding:13px 22px 0;box-shadow:inset 0 -1px 0 var(--n800);overflow-x:auto}
.tab{background:none;border:0;padding:0 0 9px;font-size:13.5px;color:var(--n500);display:flex;align-items:center;gap:6px;position:relative;white-space:nowrap}
.tab.on{color:var(--text);font-weight:600}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.tab .c{font-size:11px;padding:1px 6px;border-radius:20px;background:var(--n900);color:var(--n500)}
.tab .c.hot{background:var(--red-soft);color:var(--red);font-weight:600}
.filters{display:flex;align-items:center;gap:9px;padding:14px 22px 0;flex-wrap:wrap}
.pillf{display:flex;align-items:center;gap:7px;background:var(--surface);border-radius:9px;box-shadow:var(--sh-sm);padding:6px 11px;font-size:13px}
.pillf b{font-weight:500}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
.chk input{width:15px;height:15px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--n600)}
.sec{padding:16px 22px 0}
.sec-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:9px}

/* ── cards / panels ─────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.cards.c2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--sh-sm);padding:14px 15px 12px;animation:fadeUp .3s ease both;min-width:0}
.card .ch{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--n600)}
.card .ch .go{margin-left:auto;color:var(--n700)}
.card .n{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:5px 0 1px;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.card .n em{font-style:normal;font-size:12.5px;font-weight:500}
.card .n small{font-size:14px;font-weight:500;color:var(--n500)}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--n500)}
.card .d{font-size:12px;color:var(--n600)}
.card svg.spark{width:100%;height:34px;display:block;margin-top:7px}
.panel{background:var(--surface);border-radius:12px;box-shadow:var(--sh-sm);padding:15px 17px;min-width:0;overflow-x:auto}
.panel.flush{padding:15px 0 0}
.panel.flush > .ph{padding:0 17px}
.panel.flush table{margin-top:4px}
.panel.flush th:first-child,.panel.flush td:first-child{padding-left:17px}
.panel.flush th:last-child,.panel.flush td:last-child{padding-right:17px}
.ph{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.ph b{font-size:15px;font-weight:600}
.ph span{font-size:12px;color:var(--n600)}
.ph .r{margin-left:auto;display:flex;gap:7px;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:12px;align-items:start}
.split.wide{grid-template-columns:minmax(0,1fr) 520px}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split.l{grid-template-columns:320px minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}

/* ── bars / pills / tables ──────────────────────────────── */
.segbar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:2px 0 10px}
.segbar i{display:block;transition:flex-grow .4s}
.seglg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--n500)}
.seglg b{color:var(--text);font-weight:600}
.seglg em{font-style:normal;width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:20px;padding:4px 11px;font-size:12.5px;border:1px solid var(--n800);background:var(--surface);color:var(--n500)}
.chip:hover{border-color:var(--accent-mid);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--n600);font-weight:500;
  padding:7px 9px;border-bottom:1px solid var(--n800);white-space:nowrap;cursor:pointer}
th:hover{color:var(--text)}
th[data-dir]::after{content:" ↑";font-size:10px}
th[data-dir="desc"]::after{content:" ↓"}
th.na{cursor:default}th.na:hover{color:var(--n600)}
th{white-space:normal;line-height:1.3;vertical-align:bottom;min-width:0}
td{padding:8px 9px;border-bottom:1px solid var(--n900);font-size:13px;vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:#f4faf6}
tr.row[aria-selected="true"] td{background:var(--accent-soft)}
tr.row[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.row.bump td{animation:flash 1.6s ease-out}
tr.tot td{font-weight:600;border-bottom:0;background:#f4faf6}
.who b{font-weight:600;display:block;line-height:1.25}
.who span{font-size:11px;color:var(--n600)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.p-critical{background:var(--red);color:#fff}
.p-high{background:var(--red-soft);color:var(--red)}
.p-medium{background:var(--amber-soft);color:var(--amber)}
.p-low{background:var(--blue-soft);color:var(--blue)}
.p-verylow,.p-very-low{background:var(--n900);color:var(--n500)}
.p-na{background:repeating-linear-gradient(135deg,var(--n900),var(--n900) 4px,#fff 4px,#fff 8px);color:var(--n500);box-shadow:inset 0 0 0 1px var(--n800)}
.p-ok{background:var(--green-soft);color:var(--green)}
.p-neutral{background:var(--n900);color:var(--n500)}
.p-info{background:var(--blue-soft);color:var(--blue)}
.sc{display:flex;align-items:center;gap:8px}
.sc b{font-weight:600;min-width:21px;font-variant-numeric:tabular-nums}
.sc .bar{width:62px;height:7px;border-radius:4px;background:var(--n900);flex:none;overflow:hidden}
.sc .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.sc .dl{font-size:11px;font-weight:600;min-width:28px}
.mini{display:block;width:60px;height:20px}
.empty{padding:24px 0;color:var(--n600);font-size:13px;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:baseline}
.kv dt{color:var(--n600);font-size:12px;white-space:nowrap}
.kv dd{margin:0;font-weight:500}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid4 .k,.k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--n600)}
.bignum{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ── player card ────────────────────────────────────────── */
.pc-head{display:flex;gap:13px;align-items:flex-start;padding-bottom:13px;border-bottom:1px solid var(--n900);margin-bottom:13px}
.pc-head .big{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.pc-head h3{margin:0;font-size:16px;font-weight:600}
.pc-head .sub{font-size:12px;color:var(--n600);margin:2px 0 6px}
.trend{width:100%;height:70px;display:block;margin:5px 0 2px}
.term{padding:8px 0;border-bottom:1px solid var(--n900)}
.term:last-child{border-bottom:0}
.term .tr1{display:flex;align-items:baseline;gap:8px}
.term .tr1 b{font-weight:500;font-size:13px;flex:1}
.term .tr1 .w{font-size:11px;color:var(--n600);font-variant-numeric:tabular-nums}
.term .tr1 .c{font-size:11.5px;font-weight:600;color:var(--accent);min-width:30px;text-align:right}
.tbar{height:8px;border-radius:4px;background:var(--n900);position:relative;margin:5px 0 4px}
.tbar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .4s}
.tbar b{position:absolute;top:-3px;width:2px;height:14px;background:var(--n400);border-radius:1px}
.term .d{font-size:11.5px;color:var(--n600)}
.lgd{display:flex;gap:14px;font-size:11px;color:var(--n600);margin-top:9px}
.lgd em{font-style:normal;display:inline-block;width:12px;height:8px;border-radius:3px;background:var(--accent);margin-right:5px;vertical-align:middle}
.lgd i{display:inline-block;width:2px;height:11px;background:var(--n400);margin-right:5px;vertical-align:middle}
.reasons{margin:0;padding-left:16px;font-size:12.5px;color:var(--n400)}
.reasons li{margin-bottom:5px}
.reasons strong{color:var(--text)}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.inp{width:100%;border-radius:9px;border:1px solid var(--n800);background:#fff;padding:8px 11px;outline:none;font-size:13px}
.inp:focus{border-color:var(--accent-mid)}
textarea.inp{min-height:64px;resize:vertical}

/* ── timeline ───────────────────────────────────────────── */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--n800)}
.tle{position:relative;padding:8px 0;border-bottom:1px solid var(--n900)}
.tle:last-child{border-bottom:0}
.tle::before{content:"";position:absolute;left:-19px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--n700);box-shadow:0 0 0 3px var(--surface)}
.tle.risk::before{background:var(--red)}
.tle.fin::before{background:var(--blue)}
.tle.game::before{background:var(--accent)}
.tle.case::before{background:var(--amber)}
.tle .r1{display:flex;gap:9px;align-items:baseline}
.tle .r1 b{font-weight:500;flex:1;font-size:13px}
.tle .r1 time{font-size:11.5px;color:var(--n600);font-variant-numeric:tabular-nums;white-space:nowrap}
.tle .r2{font-size:12px;color:var(--n600);margin-top:1px}
.tle .src{font-size:10.5px;color:var(--n700);margin-top:2px}

/* ── rules / switches / logs ────────────────────────────── */
.rule{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--n900)}
.rule:last-child{border-bottom:0}
.rule .rb{flex:1;min-width:0}
.rule .rb b{font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rule .rb p{margin:3px 0 0;font-size:12px;color:var(--n600)}
.rule .rb code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--n900);padding:1px 5px;border-radius:5px;color:var(--n400)}

let EVIDX = null;
function evIndex(){
  if (EVIDX) return EVIDX;
  const m = new Map();
  RG.events().forEach(e=>{
    let o = m.get(e.playerId);
    if (!o) m.set(e.playerId, o = { first:e.timestamp, sessStart:e.timestamp, last:0, n:0, game:'', bet:0, spins:0 });
    if (o.last && e.timestamp - o.last > 15*60*1000){ o.sessStart = e.timestamp; o.spins = 0; }
    o.last = e.timestamp; o.n++;
    if (e.source) o.src = e.source;
    if (e.type === 'spin'){ o.spins++; if (e.gameId) o.game = e.gameId; o.bet = e.bet;
      if (e.market !== undefined) o.market = e.market;
      if (e.live !== undefined) o.live = e.live; }
  });
  EVIDX = m; return m;
}
/* Per-pass caches. rows() walks the whole base and scores every profile, so
   without these the 900 ms live tick recomputed 597 profiles several times
   over and saturated the main thread — which is what made the blocks appear
   to rebuild. Both are cleared once per repaint / live patch. (var, not let:
   the entity generators below call prof() while this file is still loading.) */
const invalidateIdx = () => { EVIDX = null; PORT = null; ROWSC = null; PROFC = null; };
const lastSeen = id => { const o = evIndex().get(id); return o ? o.last : 0; };
/* Players emitting events into this document right now (emulator + game client),
   counted only within the current context so the figure matches the rows the
   live screens actually show. */
const sampleLive = () => { let n = 0; evIndex().forEach((o,id)=>{
  if (Date.now()-o.last < 10*60*1000 && inScope(id) &&
      !(EXCL_SE && LIMITS.some(l=>l.playerId===id && l.type==='Self-exclusion'))) n++; }); return n; };
/* Platform-level online figure. The loaded sample is 1/SCALE of the operator's
   base, so concurrent players are reported at portfolio scale: the emitting
   sample scaled up, plus the rest of the base that the console only sees in
   aggregate. The aggregate part is held for 20 s at a time so every panel on
   screen quotes the same number instead of drifting apart between renders. */
/* Portfolio-scale counters are server-side aggregates, not per-event values:
   re-deriving them every second made eight figures in the top block change at
   once (one emulated session opening moves the scaled figure by SCALE), which
   read as the whole block flickering. They refresh on a slower cadence while
   row-level data — scores, stake bars, last activity, the event stream —
   keeps updating every second. */
const _HELD = {};
function held(key, ms, fn){
  const h = _HELD[key], now = Date.now();
  if (h && now - h.at < ms) return h.v;
  const v = fn();
  _HELD[key] = { at: now, v };
  return v;
}
let _lcBase = 0, _lcAt = 0, _lcHeld = null;
function liveCount(){
  if (_lcHeld !== null) return _lcHeld;   // one figure per patch pass, read by every consumer
  if (!sampleLive()) return 0;      // nothing emitting: never quote a figure the screens cannot show
  return held('online', 6000, ()=>{
    const now = Date.now(), t = now/60000;
    if (now - _lcAt > 20000){ _lcAt = now; _lcBase = 1840 + Math.round(210*Math.sin(t/40) + 90*Math.sin(t/7)); }
    return _lcBase + sampleLive()*SCALE;
  });
}
function rows(){
  if (ROWSC) return ROWSC;

/* Generic column sort. Most tables in the console are reference or ledger
   views whose columns have no named sort key; rather than hand-writing an
   accessor for each, any such column is sorted by its own rendered text
   (numeric when every cell parses as a number). Each table on a screen gets a
   stable index so two tables never share a sort state. */
let gSort = null;      // { t: tableIndex, c: colIndex, dir }
let _tIdx = 0;
const cellText = html => String(html).replace(/<[^>]*>/g,' ').replace(/&[a-z]+;/gi,' ').trim();
function genericSort(list, cols, ti){
  if (!gSort || gSort.t !== ti) return list;
  const render = cols[gSort.c] && cols[gSort.c][1];
  if (!render) return list;
  /* A cell counts as numeric only when the cleaned text is a single number.
     parseFloat alone read "10.4.17.158" as 10.4, so whole columns of IPs and
     version strings collapsed into ties and never sorted. */
  const keyed = list.map((r,i)=>{
    const t = cellText(render(r,i));
    const clean = t.replace(/[^0-9.\-]/g,'');
    const isNum = /^-?\d+(\.\d+)?$/.test(clean) && clean !== '';
    return { r, t, n: isNum ? parseFloat(clean) : null };
  });
  const numeric = keyed.every(k=>k.n !== null);
  const d = gSort.dir === 'desc' ? -1 : 1;
  keyed.sort((a,b)=> numeric ? d*(a.n-b.n) : d*a.t.localeCompare(b.t));
  return keyed.map(k=>k.r);
}
function T(cols, list, opts){
  opts = opts || {};
  if (!list.length) return `<div class="empty">${opts.empty||'Nothing to show for the current context.'}</div>`;
  const ti = _tIdx++;
  list = genericSort(list, cols, ti);
  const gk = ci => 'g:'+ti+':'+ci;
  const gdir = ci => (gSort && gSort.t===ti && gSort.c===ci) ? ` data-dir="${gSort.dir}"` : '';
  return `<table><thead><tr>${cols.map((c,ci)=>`<th ${c[2]?`data-sort="${c[2]}"`:`data-sort="${gk(ci)}"`}${c[2] ? (String(c[2]).startsWith('l:') ? (('l:'+lSortKey)===c[2] ? ` data-dir="${lSortDir}"` : '') : (sortKey===c[2] ? ` data-dir="${sortDir}"` : '')) : gdir(ci)}>${c[0]}</th>`).join('')}</tr></thead>
    <tbody>${list.map(r=>`<tr class="${opts.rowClass?opts.rowClass(r):''}" ${opts.rowId?`data-id="${opts.rowId(r)}"`:''} ${opts.rowKind?`data-kind="${opts.rowKind}"`:''} ${opts.sel&&opts.sel(r)?'aria-selected="true"':''}>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}
    ${opts.total?`<tr class="tot">${opts.total.map(t=>`<td>${t}</td>`).join('')}</tr>`:''}</tbody></table>`;
}
function hbars(list, unit){

    <span class="v">${typeof x[1]==='number'?nf(x[1]):x[1]}${unit||''}</span></div>`).join('')}</div>`;

function spark(vals, color){
  const w=280,h=34,mx=Math.max(...vals),mn=Math.min(...vals),r=(mx-mn)||1,st=w/(vals.length-1);
  const d=vals.map((v,i)=>`${i?'L':'M'}${(i*st).toFixed(1)},${(h-3-((v-mn)/r)*(h-9)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><title>${vals.length} points · latest ${nf(vals[vals.length-1])}, range ${nf(mn)}–${nf(mx)}</title><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/></svg>`;
}
/* Decorative trend series. The shape is generated once per seed and cached:
   deriving it from the current value meant the line was recomputed whenever a
   counter moved, so the whole SVG was swapped out on every live pass and the
   card visibly flashed. The sparkline conveys shape, not the live figure. */
const _WALK = {};
function walk(seed,n,base,amp){
  const k = seed+'|'+n;
  if (_WALK[k]) return _WALK[k];
  const r = mul(seed);
  return _WALK[k] = Array.from({length:n},(_,i)=> Math.max(0, base + (r()-.45)*amp + i*amp*.04));
}
function miniBars(id){
  const evs = RG.events().filter(e=>e.playerId===id && e.type==='spin').slice(-12);
  if (!evs.length) return '<svg class="mini"></svg>';
  const mx = Math.max(...evs.map(e=>e.bet));
  return `<svg class="mini" viewBox="0 0 60 20">${evs.map((e,i)=>{
    const hh = Math.max(2, e.bet/mx*18);
    return `<rect x="${i*5}" y="${20-hh}" width="3.6" height="${hh}" rx="1" fill="${e.payout>0?'#6dc79b':'#d9534f'}" opacity=".9"/>`;}).join('')}</svg>`;
}
function trendChart(id, pr, h2){
  const evs = RG.events().filter(e=>e.playerId===id && e.type==='spin');
  let pts;
  if (evs.length >= 3){
    pts = evs.slice(-24).map((e,i,a)=>{
      const sub=a.slice(0,i+1), st=sub.slice().reverse().findIndex(s=>s.payout>0);
      const streak = st<0?sub.length:st, esc = sub.length>1?sub[sub.length-1].bet/Math.max(1,sub[0].bet):1;
      return RG.clamp(pr.score*.55 + 40*RG.norm(esc,1,3.2) + 16*RG.norm(streak,0,8), 0, 100);

function evidenceFor(id, fid){
  const evs = RG.events().filter(e=>e.playerId===id);
  const out = [];
  if (fid==='chasing' || fid==='impulsive'){
    evs.filter(e=>e.type==='deposit').slice(-3).forEach((e,i)=>out.push(['TX-live-'+(i+1),'deposit.completed',
      `${nf(e.amount)} EUR placed after ${e.afterLossStreak||0} consecutive losing spins`, fmtS(e.timestamp),'casino-platform · live']));
  }
  if (fid==='tolerance' || fid==='fluct' || fid==='binge'){
    evs.filter(e=>e.type==='spin').slice(-4).forEach((e,i)=>out.push(['BET-live-'+(i+1),'bet.placed',
      `stake ${e.bet} · ${e.payout>0?'win '+e.payout:'no win'} · balance after ${nf(e.balanceAfter)}`, fmtS(e.timestamp),'casino-platform · live']));
  }
  SESSIONS.filter(s=>s.playerId===id).slice(0,2).forEach(s=>out.push([s.id,'session.ended',
    `${Math.floor(s.dur/60)}h ${s.dur%60}m · ${nf(s.bets)} bets · risk ${s.before}→${s.after}`, fmtS(s.started),'casino-platform']));
  TX.filter(t=>t.playerId===id).slice(0,2).forEach(t=>out.push([t.id, t.type==='Deposit'?'deposit.completed':'withdrawal.requested',
    `${nf(t.amount)} EUR · ${t.method} · ${t.status}`, fmtS(t.ts),'payments · '+t.brand]));
  return out.length ? out : [['—','no primary events','This factor is currently derived from payment aggregates only','—','CRM adapter']];
}

  const sports = RG.SEED.filter(p=>p.product === 'Sportsbook');
  for (let i=0;i<18 && sports.length;i++) EM.pool.push(sports[Math.floor(sports.length*(0.2+0.75*i/18))%sports.length]);

    gap: sports ? 6000 + Math.floor(Math.random()*22000) : 900 + Math.floor(Math.random()*2600),
    nextAt: 0, sports,
    game: isSports(p) ? EMU_EVENTS[Math.floor(Math.random()*EMU_EVENTS.length)] : EMU_GAMES[Math.floor(Math.random()*EMU_GAMES.length)],
    market: isSports(p) ? EMU_MARKETS[Math.floor(Math.random()*EMU_MARKETS.length)] : null,

function emuRotate(){
  const now = Date.now();
  const pool = emuPool();
  const ready = pool.filter(p=>!EM.live.has(p.id) &&
    !(EM.returns && EM.returns.has(p.id) && EM.returns.get(p.id) > now));
  /* Prefer accounts with no history in this session so the console keeps
     showing genuinely new arrivals rather than recycling the same rows. */
  const fresh = ready.filter(p=>!RG.LIVESET.has(p.id));
  /* If every candidate is cooling off, reopen the least recently active rather
     than leaving the console empty. */
  const queue = fresh.length ? fresh
    : ready.length ? ready
    : pool.filter(p=>!EM.live.has(p.id));

function emuStep(st){
  const id = st.p.id;
  const now = Date.now();
  if (st.nextAt && now < st.nextAt) return;      // between bets, the player is idle
  st.nextAt = now + st.gap;
  /* one spin = one instant outcome, same shape as the game client emits */
  let bal = RG.balance(id);
  if (bal < st.bet){ RG.setBalance(id, bal = bal + Math.round(st.base*40)); emuDeposit(st, Math.round(st.base*40)); }
  const win = Math.random() < 0.28;
  const payout = win ? Math.round(st.bet * (1.4 + Math.random()*7) * 100)/100 : 0;
  bal = Math.round((bal - st.bet + payout)*100)/100;
  RG.setBalance(id, bal);
  st.spins++; st.wagered += st.bet; st.pnl += payout - st.bet;
  st.lossStreak = payout > 0 ? 0 : st.lossStreak + 1;
  RG.pushEvent({ type:'spin', playerId:id, gameId:st.game, market:st.market, live:st.live,
    bet:Math.round(st.bet*100)/100, payout, balanceAfter:bal, lossStreak:st.lossStreak,
    timestamp:Date.now(), source:'emulator' });
  EM.stats.events++;
  /* scenario behaviour: escalate the stake, reload after a losing run */
  if (st.spins % 3 === 0) st.bet = Math.min(st.base*14, Math.round(st.bet*st.sc.ramp*100)/100);
  if (st.lossStreak >= 3 && Math.random() < st.sc.chase){
    const amt = Math.round(st.base*30);
    RG.setBalance(id, RG.balance(id) + amt);
    emuDeposit(st, amt);
  }
  if (st.spins >= st.target){
    EM.live.delete(id);
    /* Sports bettors commonly come back within a few minutes for the next
       market; casino players who finish a session are done for a while. */
    EM.returns = EM.returns || new Map();

}

    const q = prof(hot.playerId);

    const slaH = prio==='Critical' ? 6 : prio==='High' ? 24 : 72;

      score:prof(oc.playerId).score, segment:prof(oc.playerId).level, source:'Workflow · automated' });

      channel: ['Live chat','Email','SMS'][Math.floor(Math.random()*3)], dir:'Inbound',

/* ── automated flags → evidence chain ───────────────────── */
function checkThresholds(all){
  all.forEach(r=>{
    const prev = lastScore[r.id];
    if (prev == null) { lastScore[r.id] = r.score; return; }
    if (prev !== r.score) bumped.add(r.id);
    if (!r.pr.scored) return;
    const pl = level(prev, r.p);
    if (pl !== r.level && LEVELS.indexOf(r.level) < LEVELS.indexOf(pl)){
      const pr = r.pr;
      RG.pushEvidence({ kind:'auto', playerId:r.id, alias:r.alias,
        action:`Automated flag — ${pl} → ${r.level}`,
        detail:`Score moved ${prev} → ${r.score} on live session data. Lead factor: ${pr.top[0].name} (+${pr.top[0].contribution}). Rule ${pr.top[0].rule}.`,
        score:r.score, segment:r.level, source:'Risk engine · rules v6' });
      ALERTS.unshift({ id:'AL-'+String(ALERTS.length+1041).padStart(5,'0'), ts:Date.now(), playerId:r.id,
        before:prev, after:r.score, severity: r.level==='Critical'?'Critical':r.level==='High'?'High':'Medium',
        trigger: pr.top[0].name, supporting: pr.top.slice(1,3).map(f=>f.name), rule: pr.top[0].rule+' v6',
        owner:'—', status:'New', disposition:'Actionable', caseId:null });
    }
    lastScore[r.id] = r.score;
  });
}

/* Every listener on the current screen lives here. The reconciler re-creates
   nodes when a screen's shape changes (a row set growing, a panel appearing),
   and anything wired elsewhere would silently go dead — which is what happened
   to the table sort headers. One function, called after a render and after any
   structural patch. */
function wireView(all){
  all = all || rows();
  const chips = $('#chips');
  if (chips){
    chips.innerHTML = ['All',...LEVELS].map(s=>`<button class="chip" data-seg="${s}" aria-pressed="${(filter||'All')===s}">${s}</button>`).join('');
    $$('#chips .chip').forEach(b=> b.onclick = () => { filter = b.dataset.seg==='All'?null:b.dataset.seg; forceLive(); });
    const c = $('#count');
    if (c){
      /* On a live screen the list is the players emitting right now, so counting
         the whole loaded base here read as a contradiction. */
      const liveOnly = route === 'live.players' || route === 'live.dash';
      const shown = liveOnly ? applyFilters(all).filter(r=>Date.now()-r.seen < 10*60*1000).length : applyFilters(all).length;
      c.textContent = liveOnly
        ? `${shown} online now · ${all.length} profiles loaded`
        : `${shown} of ${all.length} loaded profiles`;
    }
  }
  $$('#view th[data-sort]').forEach(th=> th.onclick = () => {
    const k = th.dataset.sort;
    if (k.startsWith('g:')){
      const [, t, c] = k.split(':').map(Number);
      gSort = (gSort && gSort.t===t && gSort.c===c)
        ? { t, c, dir: gSort.dir==='desc' ? 'asc' : 'desc' }
        : { t, c, dir: 'asc' };
      forceLive();
      return;
    }
    if (k.startsWith('l:')){
      const lk = k.slice(2);
      if (lk === lSortKey) lSortDir = lSortDir==='desc'?'asc':'desc';
      else { lSortKey = lk;
        const asc = ['player','trigger','rule','owner','disposition','kase','id','tx_id','tx_player','tx_type','tx_method','tx_status','tx_session','rd_id','rd_player','rd_game','rd_session','se_id','se_player','se_prod','g_name','g_prov','g_vol','iv_id','iv_player','iv_channel','iv_kind','iv_mode','iv_template','iv_status','iv_actor','iv_case','t_id','t_name','t_channel','t_locale','t_jur','t_ver','t_appr','t_eff','t_ab','t_prov','w_id','w_name','w_trigger','w_mode','w_status','e_channel'];
        lSortDir = asc.includes(lk) ? 'asc' : 'desc'; }
      forceLive();
      return;
    }
    if (k===sortKey) sortDir = sortDir==='desc'?'asc':'desc';
    else { sortKey = k; sortDir = ['alias','signal','juris','kyc','vip','kase'].includes(k)?'asc':'desc'; }
    forceLive();   // reorders the rows in place; the blocks above stay as they are
  });
  const REC = {
    alert: id => ALERTS.find(a=>a.id===id),
    tx: id => TX.find(t=>t.id===id),
    session: id => SESSIONS.find(x=>x.id===id),
    comm: id => COMMS.find(c=>c.id===id),
    audit: id => AUDIT.find(a=>a.id===id),
    intervention: id => INTERVENTIONS.find(i=>i.id===id),
    limit: id => LIMITS.find(l=>l.playerId+'|'+l.type===id),
  };
  $$('#view tr.row').forEach(tr=> tr.onclick = e => {
    if (e.target.closest('a,button,input')) return;
    const k = tr.dataset.kind;
    if (k==='case'){ caseId = tr.dataset.id; go('case.work'); return; }
    if (k==='player' || !k){ selected = tr.dataset.id; _userPicked = true; if (route==='risk.players') paint(); else go('player'); return; }
    const rec = REC[k] && REC[k](tr.dataset.id);
    if (rec) recordModal(k, rec);
  });
  $$('#view [data-player]').forEach(el=> el.onclick = e => { e.stopPropagation(); selected = el.dataset.player; _userPicked = true; go('player'); });

  $$('#view [data-selal]').forEach(cb=> cb.onclick = e => { e.stopPropagation();

  $$('#view [data-hb]').forEach(el=>{

  $$('#view .card').forEach(c=>{
    const k = (c.querySelector('.ch')||{}).textContent;

    const d = DRILL[key] || DRILL[key.split(' · ')[0]];

    c.title = 'Open ' + (META[d[0]] ? META[d[0]][1] : d[0]);
    c.onclick = () => { if (d[1]) filter = d[1]; go(d[0]); };
  });
  if (!can('act')){
    $$('#view [data-pact],#view [data-cact],#view [data-act]:not([data-act="export-trail"]),#view .sw,#pc [data-pact]')
      .forEach(el=>{ if (!el.dataset.act || !/export/.test(el.dataset.act)) el.remove(); });
    $$('#view textarea,#view .inp').forEach(el=>{ el.setAttribute('readonly','readonly'); el.style.opacity = '.6'; });
  }
  const oc = $('#openClient2'); if (oc) oc.onclick = openClient;
  const eb = $('#emuBtn'); if (eb) eb.onclick = () => emuToggle();
  const ec = $('#emuConc'); if (ec) ec.oninput = e => { EM.conc = +e.target.value; e.target.nextElementSibling.textContent = EM.conc; if (EM.on) emuRotate(); };
  const es = $('#emuSpeed'); if (es) es.oninput = e => { EM.speed = +e.target.value; e.target.nextElementSibling.textContent = '\u00d7'+EM.speed; };
  const er = $('#emuReset'); if (er) er.onclick = () => { if (confirm('Clear the event store, evidence chain and balances?')) { emuToggle(false); RG.resetAll(); location.reload(); } };
  const ee = $('#expEv'); if (ee) ee.onclick = exportSheet;
  const e2 = $('#expEv2'); if (e2) e2.onclick = exportSheet;
  $$('[data-pact]').forEach(b=> b.onclick = () => {
    const noteEl = $('#note'), note = noteEl ? noteEl.value.trim() : '';
    const pr = prof(selected);
    RG.pushEvidence({ kind:'action', playerId:selected, alias:RG.byId[selected].alias, action:b.dataset.pact,
      detail:`${note?note+' — ':''}score ${pr.score} (${pr.level}); lead factor: ${pr.top[0].name} (+${pr.top[0].contribution})`,
      score:pr.score, segment:pr.level, source:'Operator · dana.keller' });
    paint();

  $$('[data-cact]').forEach(b=> b.onclick = () => {
    const c = CASES.find(x=>x.id===caseId) || CASES[0];
    const rt = $('#rationale'), dec = $$('#view .chip[data-dec][aria-pressed="true"]')[0];
    c.rationale = rt ? rt.value.trim() : c.rationale;
    if (b.dataset.cact==='Case resolved'){ c.status='Resolved'; c.resolution='Limits applied'; }
    if (b.dataset.cact==='Marked false positive'){ c.status='Dismissed'; c.resolution='False positive'; }
    if (b.dataset.cact==='Case escalated'){ c.status='Escalated'; }
    RG.pushEvidence({ kind:'action', playerId:c.playerId, alias:RG.byId[c.playerId].alias,
      action:`${b.dataset.cact} — ${c.id}`,
      detail:`${dec?'decision: '+dec.dataset.dec+'; ':''}${c.rationale||'no rationale supplied'}`,
      score:prof(c.playerId).score, segment:prof(c.playerId).level, source:'Operator · dana.keller' });
    paint();
  });
}
const openClient = () => { RG.setActive(selected); window.open('casino.html','_blank'); };

var _userPicked = false;
var _userPicked = false;   // set once the operator picks a player by hand
/* record lookup + row wiring, reusable by both the full paint and livePatch */
const RECFIND = {
  alert: id => ALERTS.find(a=>a.id===id),
  tx: id => TX.find(t=>t.id===id),
  session: id => SESSIONS.find(x=>x.id===id),
  comm: id => COMMS.find(c=>c.id===id),
  audit: id => AUDIT.find(a=>a.id===id),
  intervention: id => INTERVENTIONS.find(i=>i.id===id),
  limit: id => LIMITS.find(l=>l.playerId+'|'+l.type===id),
};
function wireRows(root){
  root.querySelectorAll('tr.row').forEach(tr=> tr.onclick = e => {
    if (e.target.closest('a,button,input')) return;
    const k = tr.dataset.kind;
    if (k==='case'){ caseId = tr.dataset.id; go('case.work'); return; }
    if (k==='player' || !k){ selected = tr.dataset.id; _userPicked = true; if (route==='risk.players') repaint(true); else go('player'); return; }
    const rec = RECFIND[k] && RECFIND[k](tr.dataset.id);
    if (rec) recordModal(k, rec);
  });
  root.querySelectorAll('[data-player]').forEach(el=> el.onclick = e => { e.stopPropagation(); selected = el.dataset.player; _userPicked = true; go('player'); });
  root.querySelectorAll('[data-case]').forEach(el=> el.onclick = e => { e.stopPropagation(); caseId = el.dataset.case; go('case.work'); });
  root.querySelectorAll('[data-factor]').forEach(el=> el.onclick = e => { e.stopPropagation(); factorId = el.dataset.factor; go('risk.factors'); });
  root.querySelectorAll('[data-selal]').forEach(cb=> cb.onclick = e => { e.stopPropagation();
    cb.checked ? ALSEL.add(cb.dataset.selal) : ALSEL.delete(cb.dataset.selal); repaint(true); });
}
const LIVE_ROUTES = ['q.all','q.mine','q.overdue','player','pl.db','case.queues','live.dash','live.players','live.emu'];
/* In-place live update. A full paint() rebuilds every panel, which makes the
   whole screen jump on each emulator tick, so on live routes only the values
   that actually change are rewritten: the header counters, the event stream
   and the score/stake/level cells of rows already on screen. Structure and
   row order stay untouched, so nothing shifts. */
/* Cheap change signature. Re-rendering a screen costs a full re-score of the
   base, so a pass that would produce identical output is skipped outright —
   without this the console did that work every second and the resulting
   main-thread stalls read as flicker. */
function liveSig(){
  return [RG.events().length, sampleLive(), ALERTS.length, RG.evidence().length, EM.live.size,
    TX.length, SESSIONS.length, CASES.length, INTERVENTIONS.length, COMMS.length, AUDIT.length].join('|');
}
let _sig = '';
let _lpAt = 0, _lpTimer = null;
function livePatch(){
  /* Every screen is a data screen, so all of them update; the ones that carry
     a live stream do it every second, reference and configuration screens on a
     slower beat. The signature check above means an unchanged screen costs
     nothing either way. */
  const now = Date.now(), wait = (LIVE_ROUTES.includes(route) ? 1000 : 3500) - (now - _lpAt);
  if (wait > 0){
    if (!_lpTimer) _lpTimer = setTimeout(()=>{ _lpTimer = null; livePatch(); }, wait);
    return;
  }
  const sig = liveSig();
  if (sig === _sig){ _lpAt = now; return; }       // nothing changed: do no work at all
  _sig = sig;
  clearTimeout(_lpTimer); _lpTimer = null; _lpAt = now;
  livePatchNow();
}
/* ── DOM reconciler ──────────────────────────────────────────────────
   Live updates used to copy innerHTML into card values, bar rows and table
   bodies. That destroys and re-creates the nodes underneath, which is what
   read as the block re-assembling. This walks the current screen against a
   freshly rendered copy and touches only what genuinely differs: text nodes
   get a new value, attributes are set in place, and an element is replaced
   only when the tree shape itself changed. Handlers, focus, scroll position
   and selection all survive, so the console can update every second without
   a single visible jump. */
const NOSYNC = 'INPUT,SELECT,TEXTAREA,OPTION';
/* A changed figure is highlighted in place — green when it moved the safe way,
   red when risk went up — so an operator can see what the stream just did
   without hunting for it. Capped per pass so an update never turns the screen
   into a wall of colour. */
const NUM = t => { const m = String(t).replace(/[^0-9.\-]/g,''); const v = parseFloat(m); return isFinite(v) ? v : null; };
const DOWN_IS_GOOD = /alert|risk|critical|overdue|breach|decline|loss|chas|escalat/i;
let _marks = 0;
function markChange(node, oldV, newV){
  if (_marks >= 10) return;
  const host = node.nodeType === 3 ? node.parentElement : node;
  if (!host || !host.closest) return;
  const cell = host.closest('.n,.v,.dl,.bdg,td,#liveN');
  if (!cell || cell.dataset.nomark) return;
  const a = NUM(oldV), b = NUM(newV);
  let cls = 'u-ne';
  if (a !== null && b !== null && a !== b){
    const ctx = (cell.closest('.card,tr,.hb') || cell).textContent || '';
    const rose = b > a;
    cls = (rose === DOWN_IS_GOOD.test(ctx)) ? 'u-up' : 'u-dn';
  }
  cell.classList.remove('u-up','u-dn','u-ne');
  void cell.offsetWidth;
  cell.classList.add(cls);
  _marks++;
}
const rowKey = tr => (tr.dataset.kind||'') + '/' + (tr.dataset.id||'');
/* Keyed row reconciliation. Replacing a tbody wholesale when one row arrives
   destroys every row on screen; instead existing rows are moved into their new
   position (which keeps their nodes and listeners) and only genuinely new rows
   are inserted — those get the arrival animation. */
function syncRows(live, fresh){
  const have = new Map();
  [...live.children].forEach(tr=>{ if (tr.dataset.id) have.set(rowKey(tr), tr); });
  const out = [];
  let inserted = false;
  [...fresh.children].forEach(fr=>{
    const k = rowKey(fr), ex = fr.dataset.id ? have.get(k) : null;
    if (ex){ sync(ex, fr); have.delete(k); out.push(ex); }
    else { const n = fr.cloneNode(true); if (n.dataset && n.dataset.id) n.classList.add('row-new'); out.push(n); inserted = true; }
  });
  const same = out.length === live.children.length && out.every((n,i)=>n === live.children[i]);
  if (!same) live.replaceChildren(...out);
  return inserted || !same;
}
function syncAttrs(a, b){
  for (const at of b.attributes) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
}
function sync(live, fresh){
  const act = document.activeElement;
  if (live.tagName === 'TBODY' && fresh.querySelector && fresh.querySelector('tr[data-id]')) return syncRows(live, fresh);
  const lc = live.childNodes, fc = fresh.childNodes;
  if (lc.length !== fc.length){
    live.replaceChildren(...fresh.childNodes);
    return true;          // caller rewires the whole view
  }
  let structural = false;
  for (let i = 0; i < lc.length; i++){
    const a = lc[i], b = fc[i];
    if (a.nodeType === 3){
      if (b.nodeType === 3 && a.nodeValue !== b.nodeValue){
        const was = a.nodeValue; a.nodeValue = b.nodeValue; markChange(a, was, b.nodeValue);
      }
      continue;
    }
    if (a.nodeType !== 1 || b.nodeType !== 1 || a.tagName !== b.tagName){
      a.replaceWith(b.cloneNode(true)); structural = true; continue;
    }
    if (a === act || a.matches(NOSYNC) || a.contains(act) && act.matches && act.matches(NOSYNC)) continue;
    syncAttrs(a, b);
    /* SVG subtrees are small and regenerated wholesale — swap only on change */
    if (a.namespaceURI !== 'http://www.w3.org/1999/xhtml'){
      if (a.outerHTML !== b.outerHTML) a.replaceWith(b.cloneNode(true));
      continue;
    }
    if (sync(a, b)) structural = true;
  }
  return structural;
}
function forceLive(){
  _sig = '';            // invalidate the change signature
  _lpAt = 0;            // and the throttle window
  livePatchNow();
}
function livePatchNow(){
  invalidateIdx();
  _marks = 0;
  /* one figure for the whole pass, so header, cards and tables agree */
  _lcHeld = null; _lcHeld = liveCount();
  const ln = $('#liveN');
  if (ln && ln.textContent !== nf(sampleLive())) ln.textContent = nf(sampleLive());
  const view = $('#view'), fn = VIEWS[route];
  if (view && fn){
    const tmp = document.createElement('div');
    _tIdx = 0;
    try { tmp.innerHTML = fn(rows()); } catch(e){ _lcHeld = null; return; }
    if (sync(view, tmp)) wireView();
  }
  _lcHeld = null;
}
let _liveIds = '';
let _pending = null, _lastPaint = 0;
function repaint(force){
  invalidateIdx();
  const now = Date.now();
  if (!force && now - _lastPaint < 1500){
    if (!_pending) _pending = setTimeout(()=>{ _pending = null; repaint(true); }, 1500 - (now - _lastPaint));
    return;
  }
  clearTimeout(_pending); _pending = null; _lastPaint = now;
  paint();
}
RG.on(msg => {
  if (msg && msg.t==='reset'){ location.reload(); return; }
  if (msg && msg.t==='active' && msg.id){ selected = msg.id; repaint(true); return; }
  if (msg && msg.t==='event' && msg.ev && !_userPicked) selected = msg.ev.playerId;
  /* Everything else on the bus — events, evidence, ticks from the game client
     or a second tab — is a data change, never a change of screen, so it goes
     through the in-place reconciler. A full render here was rebuilding the
     whole view up to twenty times a second (once per incoming event), which
     is what made the metric blocks flicker. The reconciler handles rows
     appearing and disappearing on its own, so nothing needs a rebuild. */
  if (route === 'pl.db'){ route = 'risk.players'; repaint(true); return; }
  livePatch();
});
let _visState = document.visibilityState;
document.addEventListener('visibilitychange', () => {
  /* Some embedding contexts fire this event repeatedly without the state
     actually changing; acting on every one of them rebuilt the whole view and
     made the page flicker. Only react to a real transition, and resume with
     the in-place patch rather than a full render. */
  if (document.visibilityState === _visState) return;
  _visState = document.visibilityState;
  if (_visState === 'hidden'){ clearInterval(EM.timer); EM.timer = null; }
  else { emuGuard(); livePatch(); }
});

repaint(true);

/* Nothing is online until events arrive, so a bare load would read 0 players
   everywhere. Start the emulator at low intensity so the console is live on
   open, and keep a watchdog on it: a stale event store, a backgrounded tab or
   a tab that lost its interval would otherwise leave the live screens empty
   while the counters still quoted a figure. An explicit stop on the Player
   emulator screen is respected. */
function emuGuard(){
  if (EM.userStopped) return;
  if (emuLockHeldByOther()){          // another tab is driving the demo
    if (EM.on){ clearInterval(EM.timer); EM.timer = null; EM.on = false; EM.live.clear(); }
    return;
  }
  if (!EM.on || !EM.timer || !sampleLive()){ EM.conc = EM.conc || 6; EM.speed = EM.speed || 2; emuToggle(true, true); }
  else emuClaim();
}
setTimeout(emuGuard, 400);
setInterval(emuGuard, 15000);
